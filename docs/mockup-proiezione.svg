<text x="170" y="752" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Riga 1 e riga 4 in grigio chiaro: fuori da A-B 2-3. Colonne 13-16 in grigio: oltre la misura 3/4.</text>
<text x="170" y="772" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Playhead arancio: colonna 6 sulle righe attive (2 e 5), una per gruppo. Nota verde riconosciuta. Contorno rosso: cartoncino scartato.</text>
<text x="170" y="792" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Le zone a sinistra sono etichettate dalla guida. I cartoncini colorati sono fisici: non sono disegnati dalla guida.</text>
