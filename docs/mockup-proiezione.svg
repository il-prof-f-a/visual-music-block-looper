  </g>

  <!-- Playhead: colonna dello step 6 (indice 5), arancio semitrasparente quando in esecuzione (RenderGuida) -->
  <rect x="440" y="77.2" width="50" height="625.6" fill="rgb(255,140,0)" fill-opacity="0.353"/>

  <!-- Nota riconosciuta (verde, RenderGuida: riempimento 60,179,75 e bordo 30,110,45) -->
  <rect x="290" y="77.2" width="150" height="104.27" fill="#3cb34b" stroke="#1e6e2d" stroke-width="2"/>
  <text x="365" y="134" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">clip 3 · nota 39</text>
  <rect x="640" y="285.73" width="100" height="104.27" fill="#3cb34b" stroke="#1e6e2d" stroke-width="2"/>
  <rect x="790" y="390.0" width="50" height="104.27" fill="#3cb34b" stroke="#1e6e2d" stroke-width="2"/>

  <!-- Errore: cartoncino scartato, area in rosso (RenderGuida: bordo 220,30,30 spessore 3, riempimento chiaro) -->
  <rect x="395" y="500.3" width="90" height="92" fill="#ff7878" fill-opacity="0.235" stroke="#dc1e1e" stroke-width="3"/>
  <text x="440" y="550" font-size="12" font-weight="bold" fill="#dc1e1e" text-anchor="middle">errore</text>

  <!-- Zona comandi (fisica, la guida non la disegna): x 0.84..0.98, y 0.04..0.96 -->
  <rect x="1010" y="77.2" width="140" height="625.6" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1080" y="70" font-size="13" fill="#444" text-anchor="middle">zona comandi</text>
  <!-- Cartoncino comando di esempio (corpo neutro grigio-azzurro, RenderGuida non lo disegna: e' un cartoncino fisico) -->
  <rect x="1030" y="200" width="100" height="70" fill="#6e788c" stroke="#222" stroke-width="1"/>
  <text x="1080" y="240" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAY</text>

  <!-- Etichette delle tracce (riga = colore del cartoncino) -->
  <g font-size="14" fill="#222" text-anchor="end">
    <rect x="132" y="121.2" width="16" height="16" fill="#dc2828"/><text x="124" y="134">Rosso</text>
    <rect x="132" y="225.5" width="16" height="16" fill="#ff8c00"/><text x="124" y="238">Arancione</text>
    <rect x="132" y="329.7" width="16" height="16" fill="#fad200"/><text x="124" y="342">Giallo</text>
    <rect x="132" y="434.0" width="16" height="16" fill="#28a046"/><text x="124" y="446">Verde</text>
    <rect x="132" y="538.3" width="16" height="16" fill="#1e5ac8"/><text x="124" y="550">Blu</text>
    <rect x="132" y="642.5" width="16" height="16" fill="#8232aa"/><text x="124" y="655">Viola</text>
  </g>

  <!-- Numeri di step sotto la griglia -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="215" y="722">1</text><text x="265" y="722">2</text><text x="315" y="722">3</text><text x="365" y="722">4</text>
    <text x="415" y="722">5</text><text x="465" y="722">6</text><text x="515" y="722">7</text><text x="565" y="722">8</text>
    <text x="615" y="722">9</text><text x="665" y="722">10</text><text x="715" y="722">11</text><text x="765" y="722">12</text>
    <text x="815" y="722">13</text><text x="865" y="722">14</text><text x="915" y="722">15</text><text x="965" y="722">16</text>
  </g>

  <!-- Legenda -->
  <g font-size="14" fill="#222">
    <rect x="170" y="760" width="20" height="16" fill="rgb(255,140,0)" fill-opacity="0.353" stroke="#808080"/>
    <text x="198" y="773">playhead (in esecuzione; grigio se fermo)</text>
    <rect x="560" y="760" width="20" height="16" fill="#3cb34b" stroke="#1e6e2d" stroke-width="2"/>
    <text x="588" y="773">nota riconosciuta</text>
    <rect x="770" y="760" width="20" height="16" fill="#ff7878" fill-opacity="0.235" stroke="#dc1e1e" stroke-width="2"/>
    <text x="798" y="773">cartoncino scartato</text>
    <rect x="980" y="760" width="20" height="16" fill="none" stroke="#777" stroke-dasharray="4 3"/>
    <text x="1008" y="773">zona comandi</text>
  </g>
</svg>
