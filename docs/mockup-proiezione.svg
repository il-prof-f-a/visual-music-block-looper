<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, Helvetica, sans-serif">
  <title>Mockup della guida proiettata sul tavolo</title>
  <desc>Tavolo proiettato con le tre zone speciali a sinistra (Misura, Collegamento, A-B), griglia 6 righe x 16 colonne, barre di gruppo, numeri di riga, colonne e righe oscurate, playhead sulle righe attive, una nota riconosciuta (verde), un cartoncino scartato (contorno rosso) e la zona comandi.</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#f6f6f6"/>
<text x="170" y="30" font-size="18" text-anchor="start" fill="#222" font-weight="bold">Tavolo proiettato (guida): misura 3/4, collegamento 3 righe, A-B 2-3</text>
