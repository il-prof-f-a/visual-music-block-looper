<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, Helvetica, sans-serif">
  <title>Mockup della guida proiettata sul tavolo</title>
  <desc>Tavolo proiettato: griglia 6 tracce x 16 step, playhead, una nota riconosciuta (verde), un errore (contorno rosso), zona comandi.</desc>

  <!-- Sfondo della pagina (fuori dal tavolo) -->
  <rect x="0" y="0" width="1200" height="800" fill="#f6f6f6"/>
  <text x="170" y="30" font-size="18" font-weight="bold" fill="#222">Tavolo proiettato (guida)</text>

  <!-- Tavolo: fondo bianco come RenderGuida (Color.White) -->
  <rect x="170" y="50" width="1000" height="680" fill="#ffffff" stroke="#222" stroke-width="1"/>

  <!-- Griglia: area normalizzata (0.02, 0.04, 0.80, 0.92) del tavolo; celle 50 x 104.27 px -->
  <g stroke="#d3d3d3" stroke-width="1" fill="none">
    <rect x="190" y="77.2" width="50" height="104.27"/><rect x="240" y="77.2" width="50" height="104.27"/>
    <rect x="290" y="77.2" width="50" height="104.27"/><rect x="340" y="77.2" width="50" height="104.27"/>
    <rect x="390" y="77.2" width="50" height="104.27"/><rect x="440" y="77.2" width="50" height="104.27"/>
    <rect x="490" y="77.2" width="50" height="104.27"/><rect x="540" y="77.2" width="50" height="104.27"/>
    <rect x="590" y="77.2" width="50" height="104.27"/><rect x="640" y="77.2" width="50" height="104.27"/>
    <rect x="690" y="77.2" width="50" height="104.27"/><rect x="740" y="77.2" width="50" height="104.27"/>
    <rect x="790" y="77.2" width="50" height="104.27"/><rect x="840" y="77.2" width="50" height="104.27"/>
    <rect x="890" y="77.2" width="50" height="104.27"/><rect x="940" y="77.2" width="50" height="104.27"/>
    <rect x="190" y="181.47" width="50" height="104.27"/><rect x="240" y="181.47" width="50" height="104.27"/>
    <rect x="290" y="181.47" width="50" height="104.27"/><rect x="340" y="181.47" width="50" height="104.27"/>
    <rect x="390" y="181.47" width="50" height="104.27"/><rect x="440" y="181.47" width="50" height="104.27"/>
    <rect x="490" y="181.47" width="50" height="104.27"/><rect x="540" y="181.47" width="50" height="104.27"/>
    <rect x="590" y="181.47" width="50" height="104.27"/><rect x="640" y="181.47" width="50" height="104.27"/>
    <rect x="690" y="181.47" width="50" height="104.27"/><rect x="740" y="181.47" width="50" height="104.27"/>
    <rect x="790" y="181.47" width="50" height="104.27"/><rect x="840" y="181.47" width="50" height="104.27"/>
    <rect x="890" y="181.47" width="50" height="104.27"/><rect x="940" y="181.47" width="50" height="104.27"/>
    <rect x="190" y="285.73" width="50" height="104.27"/><rect x="240" y="285.73" width="50" height="104.27"/>
    <rect x="290" y="285.73" width="50" height="104.27"/><rect x="340" y="285.73" width="50" height="104.27"/>
    <rect x="390" y="285.73" width="50" height="104.27"/><rect x="440" y="285.73" width="50" height="104.27"/>
    <rect x="490" y="285.73" width="50" height="104.27"/><rect x="540" y="285.73" width="50" height="104.27"/>
    <rect x="590" y="285.73" width="50" height="104.27"/><rect x="640" y="285.73" width="50" height="104.27"/>
    <rect x="690" y="285.73" width="50" height="104.27"/><rect x="740" y="285.73" width="50" height="104.27"/>
    <rect x="790" y="285.73" width="50" height="104.27"/><rect x="840" y="285.73" width="50" height="104.27"/>
    <rect x="890" y="285.73" width="50" height="104.27"/><rect x="940" y="285.73" width="50" height="104.27"/>
    <rect x="190" y="390.0" width="50" height="104.27"/><rect x="240" y="390.0" width="50" height="104.27"/>
    <rect x="290" y="390.0" width="50" height="104.27"/><rect x="340" y="390.0" width="50" height="104.27"/>
    <rect x="390" y="390.0" width="50" height="104.27"/><rect x="440" y="390.0" width="50" height="104.27"/>
    <rect x="490" y="390.0" width="50" height="104.27"/><rect x="540" y="390.0" width="50" height="104.27"/>
    <rect x="590" y="390.0" width="50" height="104.27"/><rect x="640" y="390.0" width="50" height="104.27"/>
    <rect x="690" y="390.0" width="50" height="104.27"/><rect x="740" y="390.0" width="50" height="104.27"/>
    <rect x="790" y="390.0" width="50" height="104.27"/><rect x="840" y="390.0" width="50" height="104.27"/>
    <rect x="890" y="390.0" width="50" height="104.27"/><rect x="940" y="390.0" width="50" height="104.27"/>
    <rect x="190" y="494.27" width="50" height="104.27"/><rect x="240" y="494.27" width="50" height="104.27"/>
    <rect x="290" y="494.27" width="50" height="104.27"/><rect x="340" y="494.27" width="50" height="104.27"/>
    <rect x="390" y="494.27" width="50" height="104.27"/><rect x="440" y="494.27" width="50" height="104.27"/>
    <rect x="490" y="494.27" width="50" height="104.27"/><rect x="540" y="494.27" width="50" height="104.27"/>
    <rect x="590" y="494.27" width="50" height="104.27"/><rect x="640" y="494.27" width="50" height="104.27"/>
    <rect x="690" y="494.27" width="50" height="104.27"/><rect x="740" y="494.27" width="50" height="104.27"/>
    <rect x="790" y="494.27" width="50" height="104.27"/><rect x="840" y="494.27" width="50" height="104.27"/>
    <rect x="890" y="494.27" width="50" height="104.27"/><rect x="940" y="494.27" width="50" height="104.27"/>
    <rect x="190" y="598.53" width="50" height="104.27"/><rect x="240" y="598.53" width="50" height="104.27"/>
    <rect x="290" y="598.53" width="50" height="104.27"/><rect x="340" y="598.53" width="50" height="104.27"/>
    <rect x="390" y="598.53" width="50" height="104.27"/><rect x="440" y="598.53" width="50" height="104.27"/>
